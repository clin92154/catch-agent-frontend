name: catch-agent-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 前端容器透過 Docker Desktop 的宿主機位址連線至後端 8001 port。
      VITE_PROXY_TARGET: http://host.docker.internal:8001
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5174"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:5174
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  frontend_node_modules:
